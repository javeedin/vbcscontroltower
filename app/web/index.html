<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Control Tower</title>
<link rel="stylesheet" href="https://static.oracle.com/cdn/jet/16.1.0/default/css/redwood/oj-redwood-min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="oj-web-applayout-body">
<div id="globalBody" class="app-root" style="visibility:hidden">

  <header class="app-header">
    <div class="brand"><div class="brand-logo">CT</div><div><b>Control&nbsp;Tower</b><span>Lifecycle cockpit · DuckDB</span></div></div>
    <div class="header-spacer"></div>
    <div class="sync"><span class="d"></span>Local DuckDB</div>
    <div class="avatar" title="You">KN</div>
  </header>

  <div class="app-main">
    <aside class="app-nav">
      <oj-navigation-list id="nav" data="[[navDP]]" selection="{{selectedView}}" drill-mode="none" aria-label="Main navigation">
        <template slot="itemTemplate" data-oj-as="item">
          <li :id="[[item.data.id]]">
            <a href="#"><span class="nav-emo" :title="[[item.data.label]]"><oj-bind-text value="[[item.data.icon]]"></oj-bind-text></span><oj-bind-text value="[[item.data.label]]"></oj-bind-text></a>
          </li>
        </template>
      </oj-navigation-list>
    </aside>

    <main class="app-content">

      <!-- PORTFOLIO (cards) -->
      <div data-bind="visible: currentType()==='cards'">
        <div class="screen-head"><div><h1 class="oj-typography-heading-lg">Portfolio</h1><div class="screen-sub">Every product, every phase — at a glance</div></div></div>
        <div class="kpis" data-bind="foreach: kpis">
          <div class="kpi"><div class="n" data-bind="text: n"></div><div class="l" data-bind="text: l"></div></div>
        </div>
        <div class="cards" data-bind="foreach: products">
          <div class="pcard">
            <div class="pcard-top"><div><h3 data-bind="text: name"></h3><div class="tag" data-bind="text: tag"></div></div><div class="ring" data-bind="text: ringText"></div></div>
            <div class="bar"><i data-bind="style:{width: barW, background: barC}"></i></div>
            <div class="meta"><span class="chip" data-bind="text: phase"></span><span data-bind="text: rel"></span></div>
          </div>
        </div>
      </div>

      <!-- TABLE (generic, reused for every list screen) -->
      <div data-bind="visible: currentType()==='table'">
        <div class="screen-head">
          <div><h1 class="oj-typography-heading-lg" data-bind="text: title"></h1><div class="screen-sub" data-bind="text: sub"></div></div>
          <oj-button chroming="callToAction" on-oj-action="[[openAdd]]" data-bind="visible: canAdd"><span data-bind="text: addLabel"></span></oj-button>
        </div>
        <oj-table id="grid" aria-label="Records" data="[[tableDP]]" columns="[[tableColumns]]"></oj-table>
      </div>

      <!-- SOON -->
      <div data-bind="visible: currentType()==='soon'">
        <div class="screen-head"><div><h1 class="oj-typography-heading-lg" data-bind="text: title"></h1></div></div>
        <div class="soon-panel">This screen is being built as a native Oracle JET view next. Its data already lives in DuckDB — the Redwood screen is on the way.</div>
      </div>

    </main>
  </div>
</div>

<!-- Add record dialog -->
<oj-dialog id="addDlg" dialog-title="Add" cancel-behavior="icon" style="width:440px;max-width:94vw">
  <div slot="body">
    <div data-bind="foreach: addFields">
      <div class="dlg-field"><label data-bind="text: label"></label><input type="text" data-bind="value: value, attr:{placeholder: label}"></div>
    </div>
  </div>
  <div slot="footer">
    <oj-button on-oj-action="[[closeAdd]]">Cancel</oj-button>
    <oj-button chroming="callToAction" on-oj-action="[[submitAdd]]">Save</oj-button>
  </div>
</oj-dialog>

<script src="https://static.oracle.com/cdn/jet/16.1.0/3rdparty/require/require.js"></script>
<script src="https://static.oracle.com/cdn/jet/16.1.0/default/js/bundles-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
